name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and style
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8
          python -m compileall -q fav_booking
          flake8 fav_booking

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install fav_booking on a fresh database
        run: |
          docker compose run --rm odoo \
            -d fav_ci \
            -i fav_booking \
            --without-demo=all \
            --stop-after-init \
            --test-enable \
            --test-tags /fav_booking \
            --http-port=8079
