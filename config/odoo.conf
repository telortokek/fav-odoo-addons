[options]
; This repository is the extra addons path. Core addons stay inside the
; official image (odoo/addons on the Python path).
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0
http_port = 8069
list_db = True
proxy_mode = False
workers = 0

; Database manager password for local development.
; Odoo reads this only from the config file. Change it before the service
; is reachable beyond localhost.
admin_passwd = admin

; Database host, port, user and password are taken from PGHOST, PGPORT,
; PGUSER and PGPASSWORD (set by docker-compose.yml from .env).
